; Linux first. Android native ABI mapping exists, but APK export awaits qualified
; SDK/NDK/vendor settings. No unverified generic APK preset is shipped.
[preset.0]
name="Linux ARM64"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
