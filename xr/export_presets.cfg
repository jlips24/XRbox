; Shared Linux/Android project. Meta Quest Debug is for manual Quest 3S testing.
; runnable=false disables editor device polling; installation is a separate step.
[preset.0]
name="Linux ARM64"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*"
export_path="../dist/xr/linux-arm64/xrbox.arm64"
script_export_mode=2

[preset.0.options]
binary_format/architecture="arm64"
binary_format/embed_pck=false

[preset.1]
name="Meta Quest Debug"
platform="Android"
runnable=false
advanced_options=true
dedicated_server=false
custom_features="quest_prototype"
export_filter="all_resources"
include_filter="legal/*"
exclude_filter="tests/*,README.md,ANDROID.md,toolchain.json,android-src/*"
export_path="../dist/xr/android/XRbox-0.1.10-xr.2-quest-debug.apk"
script_export_mode=2

[preset.1.options]
gradle_build/use_gradle_build=true
gradle_build/gradle_build_directory="res://android/build"
gradle_build/export_format=0
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=11002
version/name="0.1.10-xr.2"
package/unique_name="org.xrbox.prototype"
package/name="XRbox XR Prototype"
package/signed=true
package/show_in_app_library=true
xr_features/xr_mode=1
xr_features/enable_meta_plugin=true
meta_xr_features/quest_1_support=false
meta_xr_features/quest_2_support=false
meta_xr_features/quest_3_support=true
meta_xr_features/quest_pro_support=false
meta_xr_features/use_experimental_features=false
command_line/extra_args="--audio-driver Dummy"
permissions/internet=true
permissions/record_audio=false
permissions/camera=false
permissions/read_external_storage=false
permissions/write_external_storage=false
