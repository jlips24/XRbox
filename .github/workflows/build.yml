name: Build

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release/tag name
    runs-on: ubuntu-24.04
    outputs:
      eligible: ${{ steps.version.outputs.eligible }}
      tag: ${{ steps.version.outputs.tag }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - id: version
        env:
          XRBOX_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/ci.py release-source

  linux:
    name: Linux ARM64 Flatpak
    needs: version
    if: needs.version.outputs.eligible == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.revision }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-flatpak
      - name: Build and verify the installable Flatpak
        run: |
          mkdir -p .tools
          make xr-flatpak 2>&1 | tee .tools/flatpak-build.log
      - name: Retain Flatpak diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-logs-${{ github.run_id }}
          path: .tools/flatpak-build.log
          if-no-files-found: warn
          retention-days: 7
      - name: Prepare Flatpak artifact and provenance
        env:
          XRBOX_TAG: ${{ needs.version.outputs.tag }}
          XRBOX_BUILD_KIND: linux-arm64-flatpak
        run: |
          mkdir -p dist/ci/linux
          cp dist/xr/linux-arm64/*.flatpak dist/ci/linux/
          cp LICENSE THIRD_PARTY_NOTICES.md dist/ci/linux/
          python3 scripts/ci.py metadata --output dist/ci/linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xrbox-${{ needs.version.outputs.tag }}-linux-arm64-flatpak
          path: dist/ci/linux/
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android development APK
    needs: version
    if: needs.version.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.revision }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          godot: 'true'
          android: 'true'
      - name: Build, debug-sign and verify the APK
        run: make xr-apk
      - name: Prepare APK artifact and provenance
        env:
          XRBOX_TAG: ${{ needs.version.outputs.tag }}
          XRBOX_BUILD_KIND: android-development-apk
        run: |
          mkdir -p dist/ci/android
          cp dist/xr/android/*.apk dist/ci/android/
          cp LICENSE THIRD_PARTY_NOTICES.md dist/ci/android/
          python3 scripts/ci.py metadata --output dist/ci/android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xrbox-${{ needs.version.outputs.tag }}-android-development-apk
          path: dist/ci/android/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Attach release assets
    needs: [version, linux, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xrbox-${{ needs.version.outputs.tag }}-linux-arm64-flatpak
          path: dist/download/linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xrbox-${{ needs.version.outputs.tag }}-android-development-apk
          path: dist/download/android
      - name: Verify provenance and package release assets
        env:
          XRBOX_TAG: ${{ needs.version.outputs.tag }}
          XRBOX_REVISION: ${{ needs.version.outputs.revision }}
        run: python3 scripts/ci.py release-assets --linux dist/download/linux --android dist/download/android --output dist/release
      - name: Attach assets to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          XRBOX_TAG: ${{ needs.version.outputs.tag }}
          XRBOX_REVISION: ${{ needs.version.outputs.revision }}
        run: |
          # Refuse to attach to a tag that moved while the builds ran.
          test "$(gh api "repos/$GH_REPO/commits/$XRBOX_TAG" --jq .sha)" = "$XRBOX_REVISION"
          gh release upload "$XRBOX_TAG" dist/release/* --clobber
