name: Test

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and synthetic tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          godot: 'true'
      - name: Formatting and full workspace lint
        run: |
          mkdir -p .tools/test-results
          make check-all 2>&1 | tee .tools/test-results/check-all.log
      - name: Full synthetic test suite
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WGPU_BACKEND: vulkan
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xrbox-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          # Software Vulkan is a CI fixture, never Frame hardware evidence.
          icd="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_DRIVER_FILES="$icd"
          xvfb-run -a make test-all
      - name: Retain validation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-${{ github.run_id }}
          path: |
            .tools/test-results/
            .tools/godot-run.log
            .tools/godot-preview.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
