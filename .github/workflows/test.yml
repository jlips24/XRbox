name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and synthetic tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          godot: 'true'
      - name: Install crash debugger on CI runner
        run: sudo apt-get install --no-install-recommends -y gdb
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: full-workspace-v1
          cache-on-failure: 'true'
          cache-workspace-crates: 'true'
          cache-bin: 'false'
      - name: Formatting and full workspace lint
        run: |
          mkdir -p .tools/test-results
          make check-all 2>&1 | tee .tools/test-results/check-all.log
      - name: Full synthetic test suite
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WGPU_BACKEND: vulkan
          XRBOX_GODOT_CRASH_BACKTRACE: '1'
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xrbox-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          # Software Vulkan is a CI fixture, never Frame hardware evidence.
          icd="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_DRIVER_FILES="$icd"
          xvfb-run -a make test-ci
      - name: Retain validation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-${{ github.run_id }}
          path: |
            .tools/test-results/
            .tools/godot-*.log
            .tools/godot-preview.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
