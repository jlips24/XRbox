[package]
name = "xrbox-godot"
version = "0.1.10"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = { version = "=0.5.5", features = ["api-4-7", "experimental-threads"] }
xrbox-core = { path = "../xrbox-core", default-features = false, features = ["session"] }

xcloud-input.workspace = true
xcloud-proto.workspace = true
xcloud-media.workspace = true
parking_lot.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.21.1"
