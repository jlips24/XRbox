[package]
name = "xrbox-core"
version = "0.1.10"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
# Current native session dependencies are desktop-only. Android adapters are not
# available yet; the Godot bring-up build deliberately excludes this feature.
desktop-session = ["dep:xcloud-api", "dep:xcloud-proto", "dep:xcloud-stream", "dep:xcloud-webrtc", "dep:xcloud-media", "dep:xcloud-input", "dep:tokio", "dep:tracing", "dep:tracing-subscriber", "dep:anyhow", "dep:parking_lot", "dep:crossbeam-channel", "dep:serde_json", "dep:serde", "dep:directories", "dep:chrono"]

[dependencies]
xcloud-api = { workspace = true, optional = true }
xcloud-proto = { workspace = true, optional = true }
xcloud-stream = { workspace = true, optional = true }
xcloud-webrtc = { workspace = true, optional = true }
xcloud-media = { workspace = true, optional = true }
xcloud-input = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
crossbeam-channel = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
directories = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
xcloud-media = { workspace = true, optional = true, features = ["ffmpeg"] }
